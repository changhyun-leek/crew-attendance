<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>이창현 크루 출석체크</title>
<meta name="theme-color" content="#4f46e5" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --line:#e6e8f0; --text:#1b1d29; --muted:#767b8f;
    --brand:#4f46e5; --brand-soft:#eef0ff;
    --ok:#16a34a; --ok-soft:#e8f7ee;
    --no:#e11d48; --no-soft:#fdeaef;
    --shadow:0 1px 2px rgba(20,22,40,.06), 0 8px 24px rgba(20,22,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1117; --card:#171a23; --line:#272b38; --text:#eef0f6; --muted:#98a0b5;
      --brand:#8b87ff; --brand-soft:#242349;
      --ok:#4ade80; --ok-soft:#16281f;
      --no:#fb7185; --no-soft:#2c1620;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}

  header{text-align:center;padding:14px 0 18px}
  header h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.4px}
  header p{margin:6px 0 0;font-size:14px;color:var(--muted)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}

  .datebar{display:flex;align-items:center;gap:8px}
  .datebar label{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
  .datebar input[type=date]{
    flex:1;font:inherit;font-size:16px;font-weight:700;color:var(--text);
    background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  }
  .btn-mini{
    font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:transparent;
    color:var(--muted);border-radius:12px;padding:10px 12px;cursor:pointer;white-space:nowrap;
  }
  .btn-mini:active{transform:scale(.97)}

  .counts{display:flex;gap:8px;margin-top:12px}
  .pill{flex:1;text-align:center;border-radius:14px;padding:10px 6px;font-weight:800;font-size:14px}
  .pill small{display:block;font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.no{background:var(--no-soft);color:var(--no)}
  .pill.wait{background:var(--brand-soft);color:var(--brand)}

  .row{
    display:flex;align-items:center;gap:10px;padding:10px 4px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none}
  .name{flex:1;font-size:18px;font-weight:700;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .name.unset{color:var(--muted)}
  .choices{display:flex;gap:6px;flex:none}
  .choice{
    font:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border:1.5px solid var(--line);background:transparent;color:var(--muted);
    border-radius:14px;padding:11px 16px;transition:transform .08s, background .15s, color .15s, border-color .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .choice:active{transform:scale(.94)}
  .choice.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .choice.on-no{background:var(--no);border-color:var(--no);color:#fff}

  .sec-title{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 10px;letter-spacing:.2px}

  pre.report{
    margin:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-all;font-weight:600;
  }
  .btn{
    width:100%;font:inherit;font-size:16px;font-weight:800;cursor:pointer;
    border:none;border-radius:14px;padding:15px;margin-top:10px;
    background:var(--brand);color:#fff;-webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);font-size:15px;padding:13px}

  .warn{
    margin-top:10px;font-size:13px;font-weight:700;color:var(--no);
    background:var(--no-soft);border-radius:12px;padding:10px 12px;text-align:center;
  }

  .admin-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
  .admin-row:last-of-type{border-bottom:none}
  .admin-row input{
    flex:1;font:inherit;font-size:16px;color:var(--text);background:transparent;
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;
  }
  .icon-btn{
    font:inherit;font-size:14px;font-weight:800;cursor:pointer;flex:none;
    border:1.5px solid var(--line);background:transparent;color:var(--muted);
    border-radius:12px;padding:11px 13px;
  }
  .icon-btn.danger{color:var(--no);border-color:var(--no-soft)}
  .add-row{display:flex;gap:8px;margin-top:12px}
  .add-row input{
    flex:1;font:inherit;font-size:16px;color:var(--text);background:transparent;
    border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;
  }
  .add-row button{
    font:inherit;font-size:15px;font-weight:800;cursor:pointer;flex:none;
    border:none;background:var(--brand);color:#fff;border-radius:12px;padding:12px 18px;
  }
  .hidden{display:none !important}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);font-size:14px;font-weight:700;
    padding:12px 20px;border-radius:999px;opacity:0;transition:opacity .2s, transform .2s;
    pointer-events:none;z-index:99;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:24px 0;font-weight:600}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>이창현 크루 출석체크</h1>
    <p>자기 이름 옆에서 <b>출석</b>을 눌러주세요</p>
  </header>

  <div class="card">
    <div class="datebar">
      <label for="date">날짜</label>
      <input type="date" id="date" />
      <button class="btn-mini" id="btnToday">이번 주일</button>
    </div>
    <div class="counts">
      <div class="pill ok"><small>출석</small><span id="cOk">0</span>명</div>
      <div class="pill no"><small>결석</small><span id="cNo">0</span>명</div>
      <div class="pill wait"><small>미체크</small><span id="cWait">0</span>명</div>
    </div>
  </div>

  <div class="card" id="listCard">
    <div id="list"><div class="empty">불러오는 중…</div></div>
  </div>

  <div class="card">
    <p class="sec-title">보고 문구</p>
    <pre class="report" id="report">-</pre>
    <div id="warnWrap"></div>
    <button class="btn" id="btnCopy">보고 문구 복사하기</button>
  </div>

  <div class="card">
    <button class="btn ghost" id="btnAdminToggle">크루원 관리</button>
    <div id="adminPanel" class="hidden" style="margin-top:14px">
      <p class="sec-title">이름을 고치거나 크루원을 추가·삭제할 수 있어요</p>
      <div id="adminList"></div>
      <div class="add-row">
        <input type="text" id="newName" placeholder="새 친구 이름" maxlength="20" />
        <button id="btnAdd">추가</button>
      </div>
    </div>
  </div>

  <p class="foot">
    출석 기록은 자동 저장되고 모두에게 실시간으로 보여요.<br />
    잘못 눌렀으면 한 번 더 누르면 취소됩니다.
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://zzavmguguvuqgdblmkcj.supabase.co";
  var SUPABASE_KEY = "sb_publishable_VY0sNxSFQgHMSItmR5q5pw_4tpdrxWb";
  var ADMIN_PIN    = "crew0712";   // 관리 비밀번호 — 바꾸고 싶으면 이 값만 수정
  var CREW_NAME    = "이창현 크루";

  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var members = [];              // [{id, name, sort_order}]
  var marks = {};                // { member_id: 'present' | 'absent' }
  var curDate = "";              // 'YYYY-MM-DD'
  var adminOpen = false;

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- 날짜 ---------- */
  function toISO(d){
    return d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
  }
  // 오늘이 일요일이면 오늘, 아니면 직전 일요일
  function lastSunday(){
    var d = new Date();
    d.setHours(12,0,0,0);
    d.setDate(d.getDate() - d.getDay());
    return toISO(d);
  }
  function mmdd(iso){
    var p = iso.split("-");
    return p[1] + p[2];
  }

  /* ---------- 토스트 ---------- */
  var toastTimer = null;
  function toast(msg){
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1900);
  }

  /* ---------- 데이터 ---------- */
  function loadMembers(){
    return db.from("crew_members").select("id,name,sort_order")
      .order("sort_order", { ascending:true })
      .then(function(res){
        if(res.error) throw res.error;
        members = res.data || [];
      });
  }

  function loadMarks(){
    return db.from("attendance").select("member_id,status")
      .eq("date", curDate)
      .then(function(res){
        if(res.error) throw res.error;
        marks = {};
        (res.data || []).forEach(function(r){ marks[r.member_id] = r.status; });
      });
  }

  function refresh(){
    return Promise.all([loadMembers(), loadMarks()])
      .then(render)
      .catch(function(e){
        console.error(e);
        toast("연결에 문제가 있어요. 새로고침 해주세요");
      });
  }

  function setMark(memberId, status){
    var prev = marks[memberId];
    if(prev === status){
      // 같은 걸 다시 누르면 취소
      delete marks[memberId];
      render();
      return db.from("attendance").delete()
        .eq("date", curDate).eq("member_id", memberId)
        .then(check);
    }
    marks[memberId] = status;
    render();
    return db.from("attendance")
      .upsert({ date: curDate, member_id: memberId, status: status },
              { onConflict: "date,member_id" })
      .then(check);

    function check(res){
      if(res && res.error){
        console.error(res.error);
        toast("저장 실패! 다시 눌러주세요");
        refresh();
      }
    }
  }

  /* ---------- 렌더 ---------- */
  function render(){
    renderList();
    renderCounts();
    renderReport();
    if(adminOpen) renderAdmin();
  }

  function renderList(){
    var box = $("list");
    box.textContent = "";
    if(!members.length){
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "크루원이 없어요. 아래 '크루원 관리'에서 추가해주세요.";
      box.appendChild(e);
      return;
    }
    members.forEach(function(m){
      var st = marks[m.id];

      var row = document.createElement("div");
      row.className = "row";

      var name = document.createElement("div");
      name.className = "name" + (st ? "" : " unset");
      name.textContent = m.name;
      row.appendChild(name);

      var choices = document.createElement("div");
      choices.className = "choices";

      var bOk = document.createElement("button");
      bOk.className = "choice" + (st === "present" ? " on-ok" : "");
      bOk.textContent = "출석";
      bOk.onclick = function(){ setMark(m.id, "present"); };
      choices.appendChild(bOk);

      var bNo = document.createElement("button");
      bNo.className = "choice" + (st === "absent" ? " on-no" : "");
      bNo.textContent = "결석";
      bNo.onclick = function(){ setMark(m.id, "absent"); };
      choices.appendChild(bNo);

      row.appendChild(choices);
      box.appendChild(row);
    });
  }

  function split(){
    var ok = [], no = [], wait = [];
    members.forEach(function(m){
      var st = marks[m.id];
      if(st === "present") ok.push(m.name);
      else if(st === "absent") no.push(m.name);
      else wait.push(m.name);
    });
    return { ok:ok, no:no, wait:wait };
  }

  function renderCounts(){
    var s = split();
    $("cOk").textContent = s.ok.length;
    $("cNo").textContent = s.no.length;
    $("cWait").textContent = s.wait.length;
  }

  function reportText(){
    var s = split();
    var lines = [ mmdd(curDate), CREW_NAME ];
    lines.push("출석:" + s.ok.length + "명");
    if(s.ok.length) lines.push(s.ok.join(","));
    lines.push("결석:" + s.no.length + "명");
    if(s.no.length) lines.push(s.no.join(","));
    return lines.join(String.fromCharCode(10));
  }

  function renderReport(){
    $("report").textContent = reportText();

    var s = split();
    var w = $("warnWrap");
    w.textContent = "";
    if(s.wait.length){
      var d = document.createElement("div");
      d.className = "warn";
      d.textContent = "아직 안 누른 친구 " + s.wait.length + "명: " + s.wait.join(", ");
      w.appendChild(d);

      var b = document.createElement("button");
      b.className = "btn ghost";
      b.textContent = "미체크 " + s.wait.length + "명 모두 결석 처리";
      b.onclick = markRestAbsent;
      w.appendChild(b);
    }
  }

  function markRestAbsent(){
    var pending = members.filter(function(m){ return !marks[m.id]; });
    if(!pending.length) return;
    var rows = pending.map(function(m){
      marks[m.id] = "absent";
      return { date: curDate, member_id: m.id, status: "absent" };
    });
    render();
    db.from("attendance").upsert(rows, { onConflict: "date,member_id" })
      .then(function(res){
        if(res.error){ console.error(res.error); toast("저장 실패"); refresh(); }
        else toast(rows.length + "명 결석 처리했어요");
      });
  }

  /* ---------- 복사 ---------- */
  function copyReport(){
    var text = reportText();
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand("copy"); toast("복사했어요! 단톡에 붙여넣기 하세요"); }
      catch(e){ toast("복사 실패 — 위 글을 길게 눌러 복사해주세요"); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text)
        .then(function(){ toast("복사했어요! 단톡에 붙여넣기 하세요"); })
        .catch(fallback);
    } else fallback();
  }

  /* ---------- 크루원 관리 ---------- */
  function renderAdmin(){
    var box = $("adminList");
    box.textContent = "";
    members.forEach(function(m){
      var row = document.createElement("div");
      row.className = "admin-row";

      var input = document.createElement("input");
      input.type = "text";
      input.value = m.name;
      input.maxLength = 20;
      input.onblur = function(){
        var v = input.value.trim();
        if(!v || v === m.name){ input.value = m.name; return; }
        db.from("crew_members").update({ name: v }).eq("id", m.id)
          .then(function(res){
            if(res.error){ console.error(res.error); toast("이름 변경 실패"); input.value = m.name; }
            else { m.name = v; toast("이름을 바꿨어요"); render(); }
          });
      };
      row.appendChild(input);

      var up = document.createElement("button");
      up.className = "icon-btn";
      up.textContent = "▲";
      up.onclick = function(){ move(m, -1); };
      row.appendChild(up);

      var down = document.createElement("button");
      down.className = "icon-btn";
      down.textContent = "▼";
      down.onclick = function(){ move(m, 1); };
      row.appendChild(down);

      var del = document.createElement("button");
      del.className = "icon-btn danger";
      del.textContent = "삭제";
      del.onclick = function(){
        if(!confirm("'" + m.name + "' 크루원을 삭제할까요? 지난 출석 기록도 함께 지워집니다.")) return;
        db.from("crew_members").delete().eq("id", m.id)
          .then(function(res){
            if(res.error){ console.error(res.error); toast("삭제 실패"); }
            else toast("삭제했어요");
            refresh();
          });
      };
      row.appendChild(del);

      box.appendChild(row);
    });
  }

  function move(m, dir){
    var i = members.findIndex(function(x){ return x.id === m.id; });
    var j = i + dir;
    if(i < 0 || j < 0 || j >= members.length) return;
    var a = members[i], b = members[j];
    var ao = a.sort_order, bo = b.sort_order;
    if(ao === bo){ bo = ao + dir; }
    Promise.all([
      db.from("crew_members").update({ sort_order: bo }).eq("id", a.id),
      db.from("crew_members").update({ sort_order: ao }).eq("id", b.id)
    ]).then(refresh);
  }

  function addMember(){
    var input = $("newName");
    var v = input.value.trim();
    if(!v){ toast("이름을 입력해주세요"); return; }
    if(members.some(function(m){ return m.name === v; })){ toast("이미 있는 이름이에요"); return; }
    var next = members.length ? Math.max.apply(null, members.map(function(m){ return m.sort_order; })) + 1 : 0;
    db.from("crew_members").insert({ name: v, sort_order: next })
      .then(function(res){
        if(res.error){ console.error(res.error); toast("추가 실패"); return; }
        input.value = "";
        toast(v + " 크루원을 추가했어요");
        refresh();
      });
  }

  /* ---------- 실시간 ---------- */
  function subscribe(){
    db.channel("crew-live")
      .on("postgres_changes", { event:"*", schema:"public", table:"attendance" }, function(){
        loadMarks().then(render).catch(function(){});
      })
      .on("postgres_changes", { event:"*", schema:"public", table:"crew_members" }, function(){
        refresh();
      })
      .subscribe();
  }

  /* ---------- 초기화 ---------- */
  curDate = lastSunday();
  $("date").value = curDate;

  $("date").onchange = function(){
    curDate = $("date").value || lastSunday();
    $("date").value = curDate;
    loadMarks().then(render);
  };
  $("btnToday").onclick = function(){
    curDate = lastSunday();
    $("date").value = curDate;
    loadMarks().then(render);
  };
  $("btnCopy").onclick = copyReport;
  $("btnAdd").onclick = addMember;
  $("newName").onkeydown = function(e){ if(e.key === "Enter") addMember(); };

  $("btnAdminToggle").onclick = function(){
    if(adminOpen){
      adminOpen = false;
      $("adminPanel").classList.add("hidden");
      $("btnAdminToggle").textContent = "크루원 관리";
      return;
    }
    if(sessionStorage.getItem("crewAdmin") !== "1"){
      var pin = prompt("관리 비밀번호를 입력하세요");
      if(pin === null) return;
      if(pin.trim() !== ADMIN_PIN){ toast("비밀번호가 달라요"); return; }
      sessionStorage.setItem("crewAdmin", "1");
    }
    adminOpen = true;
    $("adminPanel").classList.remove("hidden");
    $("btnAdminToggle").textContent = "관리 닫기";
    renderAdmin();
  };

  // 앱으로 돌아왔을 때 최신 상태로
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) refresh();
  });

  refresh().then(subscribe);
})();
</script>
</body>
</html>
